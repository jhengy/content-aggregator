# .github/workflows/daily_summary.yml
# 📰 Daily Content Summary — Production-grade pipeline
# Triggers: scheduled daily at 08:00 UTC + manual dispatch

name: Daily Content Summary

on:
  schedule:
    - cron: '0 8 * * *'          # Every day at 08:00 UTC
  workflow_dispatch:              # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'
  OUTPUT_DIR: 'output'           # Where generated reports are stored

jobs:
  generate-summary:
    name: Generate Daily Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Needed for commit history if we commit

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'            # Cache pip dependencies for speed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests sumy feedparser
        # If a requirements.txt exists, use it; otherwise fallback

      - name: Run summary pipeline
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          python scripts/daily_summary.py --output ${{ env.OUTPUT_DIR }}
        # Assumed script lives at scripts/daily_summary.py

      - name: Upload generated report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-summary
          path: ${{ env.OUTPUT_DIR }}/*.md
          retention-days: 7

      - name: Commit and push report (optional)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ${{ env.OUTPUT_DIR }}/
          git diff --cached --quiet || git commit -m "📰 Daily summary $(date +'%Y-%m-%d')"
          git push
        # Remove this step if you prefer only artifact storage